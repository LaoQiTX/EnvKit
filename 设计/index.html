<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F0F3F9"><title>envkit · 界面设计</title>
<style>
:root{color-scheme:light;--bg:#e8edf6;--surface:#f8faff;--text:#26354f;--muted:#586b89;--line:#cbd6e9;--accent:#2e5fcc;--selected:#e1eafb}
:root[data-theme=dark]{color-scheme:dark;--bg:#101624;--surface:#1c2433;--text:#e2e9f6;--muted:#a6b5cf;--line:#33425d;--accent:#9dbeff;--selected:#293e66}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif}header{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1672px;padding:0 36px;margin:auto}h1{font-size:19px;letter-spacing:-.4px;margin:0}h1 span{font-size:12px;letter-spacing:0;font-weight:400;color:var(--muted);margin-left:15px}.controls{display:flex;gap:6px;align-items:center}button,a{font:12px/1.4 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);border:1px solid transparent;border-radius:5px;min-height:34px;padding:8px 13px;background:transparent;cursor:pointer;text-decoration:none;white-space:nowrap}button:hover,a:hover{background:var(--selected)}button[aria-pressed=true]{background:var(--surface);border-color:var(--line);color:var(--accent)}.divider{height:18px;width:1px;background:var(--line);margin:0 8px}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}main{margin:0 auto;padding:0 36px;max-width:1672px}.viewport{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}object{display:block;width:100%;aspect-ratio:8/5;border:0}footer{display:flex;justify-content:space-between;gap:20px;max-width:1672px;margin:0 auto;padding:16px 38px 24px;color:var(--muted);font-size:11px;line-height:1.8}footer a{font-size:11px;padding:0;color:var(--accent)}@media(max-width:800px){header{height:auto;min-height:100px;align-items:flex-start;flex-direction:column;gap:10px;padding:18px 16px}h1 span{font-size:11px}.controls{flex-wrap:wrap}main{padding:0 12px}object{min-width:1100px}footer{padding:12px 16px;flex-direction:column;gap:6px}.divider{margin:0 2px}}
</style></head><body><header><h1>envkit<span>桌面工具界面设计</span></h1><nav class="controls" aria-label="设计稿控制"><button data-page="environment" aria-pressed="true">环境变量</button><button data-page="registry" aria-pressed="false">注册表</button><span class="divider"></span><button id="theme" aria-pressed="false">深色模式</button><a id="download" href="envkit-environment-light.svg" download>下载 SVG ↗</a></nav></header><main><div class="viewport"><object id="design" type="image/svg+xml" data="envkit-environment-light.svg" aria-label="envkit 桌面应用 SVG 设计稿">可通过下载 SVG 查看设计。</object></div></main><footer><span>环境变量 / PATH 路径整理 / 注册表浏览 / 更改预览与备份</span><span>示例数据，设计稿中的操作不会修改系统。<a href="design-notes.md">查看设计说明</a></span></footer><script>
let page='environment';let theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';const art=document.getElementById('design');const toggle=document.getElementById('theme');
function sync(){document.documentElement.dataset.theme=theme;const file=`envkit-${page}-${theme}.svg`;art.data=file;document.getElementById('download').href=file;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));toggle.textContent=theme==='light'?'深色模式':'浅色模式';toggle.setAttribute('aria-pressed',String(theme==='dark'))}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;sync()}));toggle.addEventListener('click',()=>{theme=theme==='light'?'dark':'light';sync()});art.addEventListener('load',()=>{const doc=art.contentDocument;if(!doc)return;doc.querySelectorAll('a').forEach(a=>a.addEventListener('click',event=>{const m=a.getAttribute('href').match(/envkit-(environment|registry)-(light|dark)\.svg/);if(m){event.preventDefault();page=m[1];theme=m[2];sync()}}))});sync();
</script></body></html>
